name: Cloud integration tests

# Runs scripts/e2e-cloud-test.mjs against the LIVE Supabase project on
# GitHub's runners (the sandbox cannot reach supabase.co).
# Config comes from committed .env.production (publishable values only).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/e2e-cloud-test.mjs'
      - 'supabase/**'
      - '.env.production'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run e2e cloud tests
        run: node scripts/e2e-cloud-test.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }} # optional — enables test-user cleanup
