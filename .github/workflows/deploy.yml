name: Deploy PREPTRACK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        # Unset repo secrets expand to EMPTY strings here, and in Vite an empty
        # process env var overrides the committed .env.production — which used to
        # silently ship a no-cloud build where sign-in could never work. Fall back
        # to the committed publishable values whenever the secrets are empty.
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || VITE_SUPABASE_URL="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.production | head -n1)"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || VITE_SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^VITE_SUPABASE_PUBLISHABLE_KEY=//p' .env.production | head -n1)"
          export VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY
          npm run build -- --base=/My-UPSC-Prep/
        env:
          # Cloud sync config (publishable/browser-safe values only).
          # Secrets take precedence over the committed .env.production.
          # If neither is set, the build is a fully working local-mode app.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
