name: Supabase operations

# Manual one-stop workflow for the Supabase backend:
#   mode = bootstrap  → create the preptrack project, apply the SQL
#                        migration, enable email auth, print the Project URL
#                        + publishable key (browser-safe; service_role is
#                        never read or printed).
#   mode = e2e-tests  → run scripts/e2e-cloud-test.mjs against the live
#                        project (35 checks incl. RLS isolation).
#
# Requires repository secrets:
#   SUPABASE_ACCESS_TOKEN          (bootstrap; optional cleanup for e2e)
#   VITE_SUPABASE_URL              (e2e)
#   VITE_SUPABASE_PUBLISHABLE_KEY  (e2e)
#
# This checked-out ref tracks the integration branch while the feature is
# in review; the merged version on main checks out the default branch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - e2e-tests

# contents:write lets the bootstrap step commit .env.production (publishable
# values only: project URL + anon key) to the integration branch.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # After this PR merges, the default branch has everything (scripts,
        # migrations, .env.production). Pre-merge, the pinned copy on main
        # checked out the integration branch instead.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap Supabase project
        if: ${{ inputs.mode == 'bootstrap' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/bootstrap-supabase.mjs

      - name: E2E cloud tests
        if: ${{ inputs.mode == 'e2e-tests' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm ci && node scripts/e2e-cloud-test.mjs
